
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_GRPC_ENDPOINT:-0.0.0.0:4317}
      http:
        endpoint: ${env:OTEL_HTTP_ENDPOINT:-0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
